[project]
name = "aethelbuild-prototype"
version = "0.1.0"
description = "Vertical-slice AI prototype delivered by IIT Aethelgard (Pty) Ltd"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.4", "pytest-asyncio>=0.23"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
