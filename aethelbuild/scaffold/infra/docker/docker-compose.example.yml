# Reference compose for the engagement sandbox. Images are placeholders —
# set real tags for the engagement's models. No secrets here.
services:
  triton:
    image: nvcr.io/nvidia/tritonserver:24.08-py3
    command: ["tritonserver", "--model-repository=/models",
              "--strict-model-config=false", "--model-control-mode=explicit"]
    ports: ["8000:8000", "8001:8001", "8002:8002"]
  vllm:
    image: vllm/vllm-openai:latest
    command: ["--model", "${INFERENCE_MODEL}", "--enforce-eager"]
    ports: ["8081:8000"]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
