version: '3.8'

services:
  # 1. Frontend Web Service
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

  # 2. REST API Gateway (FastAPI)
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://protoforge:protoforge@db:5432/protoforge
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=protoforge_access
      - S3_SECRET_KEY=protoforge_secret
    depends_on:
      - db
      - redis
      - minio

  # 3. PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=protoforge
      - POSTGRES_PASSWORD=protoforge
      - POSTGRES_DB=protoforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 4. Redis Cache & Ephemeral State Store
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # 5. MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=protoforge_access
      - MINIO_ROOT_PASSWORD=protoforge_secret
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"

  # 6. Celery Worker (Unified Agent Execution Process)
  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A agents.core.celery_app worker -l info -c 4
    environment:
      - DATABASE_URL=postgresql://protoforge:protoforge@db:5432/protoforge
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=protoforge_access
      - S3_SECRET_KEY=protoforge_secret
    depends_on:
      - redis
      - db
      - minio

  # 7. Celery Beat (Scheduler for nightly Self-Evolution engine)
  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A agents.core.celery_app beat -l info
    environment:
      - DATABASE_URL=postgresql://protoforge:protoforge@db:5432/protoforge
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db

volumes:
  pgdata:
  miniodata:
